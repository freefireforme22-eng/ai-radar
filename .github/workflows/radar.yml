name: AI Radar

on:
  schedule:
    # Every 6 hours. GitHub queues cron jobs under load, so the exact minute
    # drifts; the 8h lookback window in config.py absorbs that.
    - cron: '5 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the bulletin but do not post'
        type: boolean
        default: false
      limit:
        description: 'Number of stories'
        default: '9'

# Two runs writing data/seen.json at once would lose fingerprints and repost
# stories, so overlapping runs are refused rather than queued.
concurrency:
  group: ai-radar
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Tests are stdlib-only. `edge-tts` is the single runtime dependency, and
      # it is needed for the Persian narration block; the pipeline degrades to
      # text-only if the import fails, so a bad release cannot break publishing.
      - name: Run offline tests
        run: |
          pip install --quiet pytest==8.3.4
          python -m pytest tests/ -q

      - name: Install narration dependency
        run: pip install --quiet edge-tts==7.2.7

      # The cover card is the only coloured element in the bulletin; rich blocks
      # expose no colour field at all, so it has to be drawn locally. Pillow on
      # the runner has no HarfBuzz/Raqm, hence the explicit shaper pair — see
      # radar/card.py. All three are optional at runtime: a failed import just
      # ships the bulletin without a cover.
      - name: Install cover-card dependencies
        run: pip install --quiet Pillow==12.3.0 arabic-reshaper==3.0.1 python-bidi==0.6.11

      # The PDF dossier is now REAL text (fpdf2 + uharfbuzz shaping), not one
      # rasterised card per page — that version the user measured as «فقط عکس
      # تیترهاست و خبر خاصی توش نیست». Optional at runtime like everything else:
      # if the import fails the bulletin falls back to the image bundle.
      - name: Install dossier dependencies
        run: pip install --quiet fpdf2==2.8.8 uharfbuzz==0.56.1

      # The animated chart is the only MOVING element. It must be uploaded as
      # h264 MP4, because Telegram downscales uploaded GIFs to 320px wide and
      # Persian labels are unreadable at that size (measured both ways). Neither
      # this runner nor the server has a system ffmpeg, so the encoder comes from
      # this wheel's bundled static binary. Optional like the cover: no wheel
      # means a GIF fallback, and a failure means a bulletin with no chart.
      #
      # The same wheel encodes the WATCHABLE edition (radar/briefing.py): the
      # drawn cards timed to the Persian narration, uploaded as a rich `video`
      # block. That needs libx264 + aac from this binary; without the wheel the
      # video slot falls back to an audio block instead of failing.
      - name: Install animation encoder
        run: pip install --quiet imageio-ffmpeg==0.5.1

      - name: Publish bulletin
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          python -m radar.run \
            --limit "${{ github.event.inputs.limit || 9 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit published-state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/rotation.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: published bulletin $(date -u +'%Y-%m-%d %H:%M UTC')"
            # A concurrent run may have pushed first; rebase instead of failing.
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
